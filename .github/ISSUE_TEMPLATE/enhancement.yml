name: ✨ Idea
description: Suggest something Seerr AI could do
labels: ['enhancement']
body:
  - type: textarea
    id: description
    attributes:
      label: What would help
      description: The problem it solves; for example, "I can't tell why [...]".
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: How it might work
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Screenshots, or how you do it today.
