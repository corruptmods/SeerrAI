# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Seerr AI's Helm chart (charts/seerr-ai-chart), as upstream Seerr's:
#
#   Lint and test   on every push and pull request that changes charts/:
#                   its README must be what helm-docs writes, and a chart
#                   changed since main is linted by chart-testing (which
#                   wants its version raised) and installed in a throwaway
#                   kind cluster, where Seerr AI (the :develop image) has to
#                   turn healthy and answer its connection test.
#   Publish         on main, when charts/ changes, or run by hand from
#                   main: a chart version not yet in the registry is pushed to
#                   oci://ghcr.io/<owner>/seerr-ai-chart, signed with cosign
#                   (keyless, from this workflow's GitHub identity), its
#                   signature checked, and its Artifact Hub metadata pushed
#                   beside it. A version already there is left alone, so a
#                   chart change goes out once its version in Chart.yaml is
#                   raised (chart-testing insists on it).
#
# Install with:  helm install seerr-ai oci://ghcr.io/<owner>/seerr-ai-chart
name: Seerr AI Charts

on:
  push:
    branches: [dev, main]
    paths:
      - 'charts/**'
      - '.github/workflows/charts.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'charts/**'
      - '.github/workflows/charts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: README is what helm-docs writes
        uses: docker://jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c

      - name: Check the README
        run: |
          if ! git diff --exit-code -- charts/; then
            echo "::error::A chart's README.md is out of date: run helm-docs and commit what it writes (the diff is above)."
            exit 1
          fi

      # Against main: on dev, every chart changed since the last release.
      - name: Which charts changed
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch main)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$changed"
          fi

      - name: Lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch main --validate-maintainers=false

      - name: Create a kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      # The image a release's chart names (its appVersion) is published only
      # once the release is tagged, so the install test runs :develop.
      - name: Install and test in kind
        if: steps.list-changed.outputs.changed == 'true'
        run: >-
          ct install --target-branch main
          --helm-extra-set-args "--set=image.tag=develop"

  package:
    name: Package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: [lint-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      has_artifacts: ${{ steps.check-artifacts.outputs.has_artifacts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Log in to GitHub's container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths are lowercase; the repository's owner may not be.
      - name: Package what isn't published yet
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p ./.cr-release-packages
          for chart_path in ./charts/*; do
            if [ -d "$chart_path" ] && [ -f "$chart_path/Chart.yaml" ]; then
              chart_name=$(grep '^name:' "$chart_path/Chart.yaml" | awk '{print $2}')
              version=$(grep '^version:' "$chart_path/Chart.yaml" | awk '{print $2}')
              if oras manifest fetch "ghcr.io/${owner}/${chart_name}:${version}" >/dev/null 2>&1; then
                echo "${chart_name} ${version} is already published."
              else
                helm dependency build "$chart_path"
                helm package "$chart_path" --destination ./.cr-release-packages
              fi
            fi
          done

      - name: Anything to publish?
        id: check-artifacts
        run: |
          if ls .cr-release-packages/*.tgz >/dev/null 2>&1; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the packages
        if: steps.check-artifacts.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charts
          include-hidden-files: true
          path: .cr-release-packages/

  publish:
    name: Publish to ghcr.io
    needs: [package]
    if: github.ref == 'refs/heads/main' && needs.package.outputs.has_artifacts == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign's keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Get the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: charts
          path: .cr-release-packages/

      - name: Log in to GitHub's container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, sign, and add the Artifact Hub metadata
        env:
          COSIGN_YES: true
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for chart_path in $(find .cr-release-packages -name '*.tgz' -print); do
            chart_release_file=$(basename "$chart_path")
            chart_name=${chart_release_file%-*}
            helm push "$chart_path" "oci://ghcr.io/${owner}" |& tee helm-push-output.log
            chart_digest=$(awk -F "[, ]+" '/Digest/{print $NF}' < helm-push-output.log)
            cosign sign "ghcr.io/${owner}/${chart_name}@${chart_digest}"
            oras push \
              "ghcr.io/${owner}/${chart_name}:artifacthub.io" \
              --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
              "charts/${chart_name}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml" \
              |& tee oras-push-output.log
            artifacthub_digest=$(grep "Digest:" oras-push-output.log | awk '{print $2}')
            cosign sign "ghcr.io/${owner}/${chart_name}:artifacthub.io@${artifacthub_digest}"
          done

  verify:
    name: Check the signatures
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Get the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: charts
          path: .cr-release-packages/

      - name: Each published chart is signed by this workflow
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for chart_path in $(find .cr-release-packages -name '*.tgz' -print); do
            chart_release_file=$(basename "$chart_path")
            chart_name=${chart_release_file%-*}
            version=${chart_release_file#"$chart_name"-}
            version=${version%.tgz}
            cosign verify "ghcr.io/${owner}/${chart_name}:${version}" \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done
