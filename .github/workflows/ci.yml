# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Checks every push to dev and main, and every pull request to them:
#
#   Checks   lint, formatting, types, translations in sync, and a build
#   Tests    the whole test suite on SQLite
#   Postgres the whole test suite on PostgreSQL, one file at a time (they
#            share one database); on pushes and when run by hand, as it
#            takes about an hour
#
# A red cross on a commit means one of these failed; the run's log says
# which test or check, and why. Nothing here publishes anything.
name: Seerr AI CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Translations in sync with the code
        run: node bin/check-i18n.js

      - name: Build
        run: pnpm build

  tests:
    name: Tests (SQLite)
    runs-on: ubuntu-24.04
    # The suite took 58 minutes by late October 2026 and grows; a run cut
    # off at the limit shows as cancelled, not failed.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests
        run: pnpm test --test-reporter spec

  postgres:
    name: Tests (PostgreSQL)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seerr
          POSTGRES_PASSWORD: seerr
          POSTGRES_DB: seerr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seerr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: seerr
      DB_PASS: seerr
      DB_NAME: seerr_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests
        run: pnpm test --concurrency 1 --test-reporter dot
