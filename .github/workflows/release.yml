# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Publishes the Seerr AI image for amd64 and arm64 (the platforms Seerr
# ships), to GitHub's container registry and, when set up, Docker Hub:
#
#   :1.2.3, :1.2, :1, :latest   for a tag ai-v1.2.3
#   :develop                    when run by hand, from dev
#   :preview-<name>             for a tag preview-<name>, or when run by hand
#                               from any other branch (preview-<branch>)
#   :sha-abc1234                for every build
#
# Release with:  git tag ai-v1.2.3 && git push origin ai-v1.2.3
# CHANGELOG.md needs a "## 1.2.3" section (a date after it is fine, like
# "## 1.2.3 (14 October 2026)"): it becomes the release notes, so rename
# "Coming next" to the version before tagging. The changelog only lists
# released versions, plus "Coming next" while dev has unreleased changes. A version with a "-"
# (ai-v1.3.0-beta.1) is a pre-release: it gets only its own tag, and does not
# move :1.2, :1 or :latest; without its own section, it uses "Coming next".
# A preview never touches any of them either.
#
# Seerr AI's tags start with "ai-v" because the repository also holds Seerr's
# own v1.0.0…v3.x tags, which this must never build or collide with.
#
# Pushing to dev publishes nothing: :develop is built when you choose to
# (Actions → Seerr AI Release → Run workflow, from dev). Each platform is
# built on its own machine (arm64 on an arm64 runner), the two are joined
# into one image, which is then signed with cosign (keyless, from this
# workflow's GitHub identity) and given a CycloneDX SBOM attestation, and
# both are checked before a release is published. Tests and checks run
# separately, in ci.yml: an ai-v tag is built only once its commit is on main
# and has passed ci.yml there (the job waits for a run still going). That
# check runs in the "release" environment, so reviewers set on it in GitHub
# approve each release once.
#
# Docker Hub is optional: with the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN set, every image also goes to <username>/seerr-ai, or to
# the repository variable DOCKERHUB_IMAGE when that is set. Without them,
# Docker Hub is skipped.
name: Seerr AI Release

on:
  push:
    tags:
      - 'ai-v*'
      - 'preview-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.plan.outputs.KIND }}
      version: ${{ steps.plan.outputs.VERSION }}
      release: ${{ steps.plan.outputs.RELEASE }}
      prerelease: ${{ steps.plan.outputs.PRERELEASE }}
      tags: ${{ steps.plan.outputs.TAGS }}
      timestamp: ${{ steps.plan.outputs.TIMESTAMP }}
      created: ${{ steps.plan.outputs.CREATED }}
      image: ${{ steps.plan.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and tags
        id: plan
        run: |
          RELEASE=false
          PRERELEASE=false
          if [[ "${GITHUB_REF}" == refs/tags/ai-v* ]]; then
            KIND=release
            VERSION="${GITHUB_REF_NAME#ai-v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${GITHUB_REF_NAME} is not ai-v followed by a version like 1.2.3"
              exit 1
            fi
            RELEASE=true
            [[ "${VERSION}" == *-* ]] && PRERELEASE=true
            # This version's section of CHANGELOG.md, without its heading, is
            # the release notes. Checked before the build, so a missing
            # section fails in seconds, not after the build.
            notes() {
              awk -v h="## $1" '
                !found && ($0 == h || index($0, h " (") == 1) { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md \
                | sed -e '/./,$!d' \
                | sed -E "s#\]\((\./)?([A-Za-z0-9_.-][^):]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\2)#g" \
                | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
              # Leading and trailing blank lines are dropped, and links to
              # files in the repository point at them as of this release.
            }
            notes "${VERSION}"
            if [[ ! -s release-notes.md && "${PRERELEASE}" == "true" ]]; then
              notes "Coming next"
            fi
            if [[ ! -s release-notes.md ]]; then
              echo "::error::CHANGELOG.md has no \"## ${VERSION}\" section. Add one (or rename \"## Coming next\") as \"## ${VERSION} (date)\", push it, and move the tag."
              exit 1
            fi
            TAGS="${VERSION}"
            if [[ "${PRERELEASE}" == "false" ]]; then
              IFS=. read -r MAJOR MINOR _ <<< "${VERSION}"
              TAGS+=" ${MAJOR}.${MINOR}"
              [[ "${MAJOR}" != 0 ]] && TAGS+=" ${MAJOR}"
              TAGS+=" latest"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/preview-* ]]; then
            KIND=preview
            NAME="${GITHUB_REF_NAME#preview-}"
            if [[ ! "${NAME}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
              echo "::error::${GITHUB_REF_NAME} can't name an image: after \"preview-\", use up to 120 letters, digits, \".\", \"_\" and \"-\", starting with a letter, digit or \"_\"."
              exit 1
            fi
            VERSION="preview-${NAME}"
            TAGS="${VERSION}"
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            # Left at 0.1.0, the app reports "develop-<commit>" and checks
            # dev's commits for updates. So does a preview.
            KIND=develop
            VERSION="develop"
            TAGS="develop"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" == refs/heads/* && "${GITHUB_REF}" != refs/heads/main ]]; then
            # Any other branch, run by hand: a preview named after it, with
            # every character an image tag can't hold made a "-".
            KIND=preview
            NAME="${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}"
            NAME="${NAME#"${NAME%%[!.-]*}"}"
            NAME="${NAME:0:120}"
            VERSION="preview-${NAME}"
            TAGS="${VERSION}"
          else
            echo "::error::Run this from dev (or another branch, for a preview), or push an ai-v or preview- tag. main only moves for a release: tag it ai-v…"
            exit 1
          fi
          TAGS+=" sha-${GITHUB_SHA::7}"
          TIMESTAMP="$(git log -1 --pretty=%ct)"
          {
            echo "KIND=${KIND}"
            echo "VERSION=${VERSION}"
            echo "RELEASE=${RELEASE}"
            echo "PRERELEASE=${PRERELEASE}"
            echo "TAGS=${TAGS}"
            echo "TIMESTAMP=${TIMESTAMP}"
            echo "CREATED=$(date -u -d "@${TIMESTAMP}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seerr-ai"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${KIND} ${VERSION}, tagged: ${TAGS}"

      - name: Keep the release notes
        if: steps.plan.outputs.RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Release checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # One approval per release: reviewers set on the "release" environment
    # in GitHub approve this job, and every publishing job waits on it.
    # Develop builds run without the environment.
    environment: ${{ needs.plan.outputs.release == 'true' && 'release' || '' }}
    permissions:
      contents: read # is the commit on main
      actions: read # its ci.yml runs
    steps:
      - name: The tagged commit is on main and passed ci.yml
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main?per_page=1" --jq .status)"
          if [[ "${STATUS}" != identical && "${STATUS}" != ahead ]]; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA::7}) is not on main. Bring main up to dev, then tag main's commit."
            exit 1
          fi
          # ci.yml may still be checking the push that brought main here.
          WAITED=0
          while true; do
            STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '
              [.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] as $runs
              | if any($runs[]; .conclusion == "success") then "passed"
                elif ($runs | length) == 0 then "none"
                elif any($runs[]; .status != "completed") then "running"
                else "failed" end')"
            case "${STATE}" in
              passed)
                echo "ci.yml passed for ${GITHUB_SHA::7}."
                break
                ;;
              failed)
                echo "::error::ci.yml failed for ${GITHUB_SHA::7}. Fix it, push, and tag the new commit."
                exit 1
                ;;
              none)
                if (( WAITED >= 600 )); then
                  echo "::error::ci.yml has not run for ${GITHUB_SHA::7}. Run it on main (Actions → Seerr AI CI → Run workflow), then re-run this."
                  exit 1
                fi
                ;;
            esac
            sleep 60
            WAITED=$((WAITED + 60))
          done

  build:
    name: Build (${{ matrix.arch }})
    needs: [plan, gate]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # the image, pushed by digest
    env:
      DOCKERHUB_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && (vars.DOCKERHUB_IMAGE || format('{0}/seerr-ai', secrets.DOCKERHUB_USERNAME)) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the version
        if: needs.plan.outputs.release == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # The app reports this version, and checks releases against it.
          sed -i -E "0,/^  \"version\": \"[^\"]*\",\$/s//  \"version\": \"${VERSION}\",/" package.json
          if ! grep -qxF "  \"version\": \"${VERSION}\"," package.json; then
            echo "::error::Couldn't set the version in package.json"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ needs.plan.outputs.timestamp }}
          labels: |
            org.opencontainers.image.title=Seerr AI
            org.opencontainers.image.description=Seerr, with Backfill, an AI admin agent, AI search, download status that says why, health alerts and shared watch lists.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.plan.outputs.created }}
          # Pushed untagged; the publish job tags the two as one image.
          outputs: type=image,"name=${{ needs.plan.outputs.image }}${{ env.DOCKERHUB_IMAGE != '' && format(',{0}', env.DOCKERHUB_IMAGE) || '' }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=seerr-ai-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=seerr-ai-${{ matrix.arch }}
          # Each platform's provenance rides in its index, which the publish
          # job merges and the sign job signs with the rest.
          provenance: mode=max

      - name: Note the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Hand the digest on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-arch image
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # the tags
    env:
      DOCKERHUB_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && (vars.DOCKERHUB_IMAGE || format('{0}/seerr-ai', secrets.DOCKERHUB_USERNAME)) || '' }}
    outputs:
      digest: ${{ steps.publish.outputs.DIGEST }}
    steps:
      - name: Collect the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag amd64 and arm64 as one image
        id: publish
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          TAGS: ${{ needs.plan.outputs.tags }}
          VERSION: ${{ needs.plan.outputs.version }}
          CREATED: ${{ needs.plan.outputs.created }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          shopt -s nullglob
          DIGESTS=(*)
          if [[ ${#DIGESTS[@]} -ne 2 ]]; then
            echo "::error::Expected an amd64 and an arm64 digest, got ${#DIGESTS[@]}"
            exit 1
          fi
          IMAGES=("${IMAGE}")
          [[ -n "${DOCKERHUB_IMAGE}" ]] && IMAGES+=("${DOCKERHUB_IMAGE}")
          read -ra TAG_LIST <<< "${TAGS}"
          ARGS=()
          for NAME in "${IMAGES[@]}"; do
            for TAG in "${TAG_LIST[@]}"; do
              ARGS+=(--tag "${NAME}:${TAG}")
            done
          done
          SOURCES=()
          for DIGEST in "${DIGESTS[@]}"; do
            SOURCES+=("${IMAGE}@sha256:${DIGEST}")
          done
          # The index carries the description too: it is what GHCR shows
          # for an image with several platforms.
          docker buildx imagetools create "${ARGS[@]}" \
            --annotation "index:org.opencontainers.image.title=Seerr AI" \
            --annotation "index:org.opencontainers.image.description=Seerr, with Backfill, an AI admin agent, AI search, download status that says why, health alerts and shared watch lists." \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            "${SOURCES[@]}"
          FIRST="${TAGS%% *}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${FIRST}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Couldn't read the published image's digest"
            exit 1
          fi
          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            HUB="$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${FIRST}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ "${HUB}" != "${DIGEST}" ]]; then
              echo "::error::Docker Hub has ${HUB}, GHCR has ${DIGEST}: they should be the same image"
              exit 1
            fi
          fi
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

  sign:
    name: Sign and attach the SBOM
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless signing: the certificate names this workflow
      packages: write # the signature and attestation, stored beside the image
    env:
      DOCKERHUB_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && (vars.DOCKERHUB_IMAGE || format('{0}/seerr-ai', secrets.DOCKERHUB_USERNAME)) || '' }}
      COSIGN_YES: 'true'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign, and attest the SBOM
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          IMAGES=("${IMAGE}")
          [[ -n "${DOCKERHUB_IMAGE}" ]] && IMAGES+=("${DOCKERHUB_IMAGE}")
          for NAME in "${IMAGES[@]}"; do
            # --recursive signs the image and each platform's image in it.
            cosign sign --recursive "${NAME}@${DIGEST}"
            trivy image --format cyclonedx --output sbom.cdx.json "${NAME}@${DIGEST}"
            cosign attest --type cyclonedx --predicate sbom.cdx.json "${NAME}@${DIGEST}"
          done

  verify:
    name: Check the signature and SBOM
    needs: [plan, publish, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      DOCKERHUB_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && (vars.DOCKERHUB_IMAGE || format('{0}/seerr-ai', secrets.DOCKERHUB_USERNAME)) || '' }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          IMAGES=("${IMAGE}")
          [[ -n "${DOCKERHUB_IMAGE}" ]] && IMAGES+=("${DOCKERHUB_IMAGE}")
          IDENTITY=(
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}"
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          )
          for NAME in "${IMAGES[@]}"; do
            cosign verify "${IDENTITY[@]}" "${NAME}@${DIGEST}" > /dev/null
            cosign verify-attestation --type cyclonedx "${IDENTITY[@]}" "${NAME}@${DIGEST}" > /dev/null
            echo "${NAME}@${DIGEST}: signature and SBOM attestation verified"
          done

  release:
    name: GitHub release
    needs: [plan, publish, verify]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    env:
      DOCKERHUB_IMAGE: ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && (vars.DOCKERHUB_IMAGE || format('{0}/seerr-ai', secrets.DOCKERHUB_USERNAME)) || '' }}
    steps:
      - name: Collect the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          IMAGE: ${{ needs.plan.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo
            echo "### Docker image"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}"
            [[ -n "${DOCKERHUB_IMAGE}" ]] && echo "${DOCKERHUB_IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Built from commit \`${GITHUB_SHA}\`. Digest \`${DIGEST}\`, signed with cosign, with an SBOM attached: [how to check it](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/seerr-ai/install.md#checking-an-image)."
          } >> release-notes.md
          FLAGS=()
          [[ "${PRERELEASE}" == "true" ]] && FLAGS=(--prerelease)
          # The title must contain the version: Settings → About compares it.
          # A release cut again (the tag moved) keeps its page, retitled and
          # with the notes refreshed from CHANGELOG.md. GitHub
          # turns a release back into a draft when its tag is deleted, so it is
          # published again here, and made the latest unless a pre-release.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            EDIT=(--prerelease=false --latest)
            [[ "${PRERELEASE}" == "true" ]] && EDIT=(--prerelease)
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Seerr AI ${VERSION}" --notes-file release-notes.md \
              --draft=false "${EDIT[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Seerr AI ${VERSION}" --notes-file release-notes.md "${FLAGS[@]}"
          fi
