# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Publishes the Seerr AI image to GitHub's container registry, for amd64 and
# arm64:
#
#   ghcr.io/<owner>/seerr-ai:1.2.3, :1.2, :latest   for a tag ai-v1.2.3
#   ghcr.io/<owner>/seerr-ai:develop                 when run by hand, from dev
#   ghcr.io/<owner>/seerr-ai:sha-abc1234             for every build
#
# Release with:  git tag ai-v1.2.3 && git push origin ai-v1.2.3
# A version with a "-" (ai-v1.3.0-beta.1) is a pre-release and does not move
# :latest.
#
# Seerr AI's tags start with "ai-v" because the repository also holds Seerr's
# own v1.0.0…v3.x tags, which this must never build or collide with.
#
# Pushing to dev publishes nothing: :develop is built when you choose to
# (Actions → Seerr AI Release → Run workflow, from dev). A build takes about
# half an hour (arm64 is built under emulation). Tests and checks run
# separately, in ci.yml.
name: Seerr AI Release

on:
  push:
    tags:
      - 'ai-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write # the GitHub release for a tag
      packages: write # the image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          RELEASE=false
          PRERELEASE=false
          if [[ "${GITHUB_REF}" == refs/tags/ai-v* ]]; then
            VERSION="${GITHUB_REF_NAME#ai-v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${GITHUB_REF_NAME} is not ai-v followed by a version like 1.2.3"
              exit 1
            fi
            RELEASE=true
            [[ "${VERSION}" == *-* ]] && PRERELEASE=true
            # The app reports this version, and checks releases against it.
            npm pkg set version="${VERSION}"
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            # Left at 0.1.0, the app reports "develop-<commit>" and checks
            # dev's commits for updates.
            VERSION="develop"
          else
            echo "::error::Run this from the dev branch, or push an ai-v tag."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seerr-ai" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.version.outputs.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }},enable=${{ steps.version.outputs.RELEASE == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }},enable=${{ steps.version.outputs.RELEASE == 'true' && steps.version.outputs.PRERELEASE == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.RELEASE == 'true' && steps.version.outputs.PRERELEASE == 'false' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Seerr AI
            org.opencontainers.image.description=Seerr, with Backfill, an AI admin agent, AI search, download status that says why, health alerts and shared watch lists.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ steps.version.outputs.TIMESTAMP }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.version.outputs.TIMESTAMP }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: GitHub release
        if: steps.version.outputs.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
        run: |
          FLAGS=""
          [[ "${PRERELEASE}" == "true" ]] && FLAGS="--prerelease"
          # The title must contain the version: Settings → About compares it.
          # A release cut again (the tag moved) keeps its page, retitled. GitHub
          # turns a release back into a draft when its tag is deleted, so it is
          # published again here, and made the latest unless a pre-release.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            EDIT="--prerelease=false --latest"
            [[ "${PRERELEASE}" == "true" ]] && EDIT="--prerelease"
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Seerr AI ${VERSION}" --draft=false ${EDIT}
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Seerr AI ${VERSION}" --generate-notes ${FLAGS}
          fi
