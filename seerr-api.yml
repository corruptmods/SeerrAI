        - settings
      responses:
        '200':
          description: AI settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettings'
    post:
      summary: Save AI settings
      description: Tested with a tiny request first when AI is being turned on or the connection changes. An empty `apiKey` keeps the saved one.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingsInput'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettings'
  /settings/ai/test:
    post:
      summary: Test the AI connection
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AiSettingsInput'
                - type: object
                  properties:
                    testModel:
                      type: string
      responses:
        '200':
          description: The model answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
  /settings/ai/models:
    post:
      summary: Models the AI key can use
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSettingsInput'
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
  /settings/ai/credit:
    get:
      summary: AI credit
      description: What the AI account has spent and has left. Neither provider reports the balance itself, so it is the balance last entered less what has been spent since, from the provider's report when an admin key is saved and otherwise estimated from Seerr's own requests. The admin key is never returned.
      tags:
        - settings
      responses:
        '200':
          description: Credit report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCreditReport'
    post:
      summary: Save AI credit settings
      description: An admin key is saved only once it has read the account's spending. A balance is recorded as of now; null forgets it. Prices replace the saved ones.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminKey:
                  type: string
                removeAdminKey:
                  type: boolean
                balance:
                  type: number
                  nullable: true
                prices:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      input:
                        type: number
                      output:
                        type: number
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCreditReport'
  /settings/tautulli:
    get:
