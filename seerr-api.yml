        required: true
        schema:
          type: number
      - in: path
        name: seasonNumber
        required: true
        schema:
          type: number
      - in: path
        name: episodeNumber
        required: true
        schema:
          type: number
      - in: path
        name: subtitleId
        required: true
        schema:
          type: number
    delete:
      summary: Delete an episode’s subtitle file
      description: Admins only.
      tags:
        - subtitles
      responses:
        '204':
          description: Deleted
  /subtitles/movie/{tmdbId}/transcription:
    parameters:
      - in: path
        name: tmdbId
        required: true
        schema:
          type: number
    get:
      summary: Transcriptions asked for this movie
      tags:
        - subtitles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionStatus'
    post:
      summary: Transcribe the movie’s audio with Whisper
      description: Runs in Bazarr, one transcription at a time. Needs permission to manage requests.
      tags:
        - subtitles
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionStatus'
  /subtitles/tv/{tmdbId}/transcription:
    parameters:
      - in: path
        name: tmdbId
        required: true
        schema:
          type: number
    get:
      summary: Transcriptions asked for this series
      tags:
        - subtitles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionStatus'
    post:
      summary: Transcribe episodes’ audio with Whisper
      description: Episodes already transcribed are left out. Needs permission to manage requests.
      tags:
        - subtitles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope
              properties:
                scope:
                  type: string
                  enum: [missing, season, notTranscribed, episode]
                seasonNumber:
                  type: number
                episodeNumber:
                  type: number
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionStatus'
  /subtitles/movie/{tmdbId}/plex-default:
