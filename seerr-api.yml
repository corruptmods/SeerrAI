        - backfill
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
    delete:
      summary: Stop searching every stuck title, after the current one
      tags:
        - backfill
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
  /backfill/scan:
