  /request:
    get:
      summary: Get all requests
      description: |
        Returns all requests if the user has the `ADMIN` or `MANAGE_REQUESTS` permissions. Otherwise, only the logged-in user's requests are returned.

        If the `requestedBy` parameter is specified, only requests from that particular user ID will be returned.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          description: >-
            One value, or several comma-separated, e.g. "pending,failed".
            Allowed: all, approved, available, pending, processing,
            unavailable, failed, deleted, completed.
          schema:
            type: string
            nullable: true
            example: pending,failed
        - in: query
          name: sort
          schema:
            type: string
            enum: [added, modified]
            default: added
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            nullable: true
            default: desc
        - in: query
          name: requestedBy
          description: One user id, or several comma-separated, e.g. "1,4".
          schema:
            type: string
            nullable: true
            example: '1,4'
        - in: query
          name: mediaType
          description: >-
            One value, or several comma-separated, e.g. "movie,tv". Allowed:
            movie, tv, all.
          schema:
            type: string
            nullable: true
            default: all
            example: movie,tv
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaRequest'
    post:
      summary: Create new request
      description: |
        Creates a new request with the provided media ID and type. The `REQUEST` permission is required.

        If the user has the `ADMIN` or `AUTO_APPROVE` permissions, their request will be auomatically approved.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaType:
                  type: string
                  enum: [movie, tv]
                  example: movie
                mediaId:
                  type: number
                  example: 123
                tvdbId:
                  type: number
                  example: 123
                seasons:
                  oneOf:
                    - type: array
                      items:
                        type: number
                        minimum: 0
                    - type: string
                      enum: [all]
                is4k:
                  type: boolean
                  example: false
                serverId:
                  type: number
                profileId:
                  type: number
                rootFolder:
                  type: string
                languageProfileId:
                  type: number
                seriesType:
                  type: string
                  nullable: true
                  enum: [standard, daily, anime, null]
                  description: Anime or not, as ticked in the request dialog (anime or standard); left out, the title's setting, override rules and anime detection decide. Null on an edit hands it back to them.
                userId:
                  type: number
                  nullable: true
                ignoreQuota:
                  type: boolean
                  example: false
                  description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
              required:
                - mediaType
                - mediaId
      responses:
        '201':
          description: Succesfully created the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
  /request/eta:
    get:
      summary: Roughly when each request should arrive
      description: Only requests the caller may see are estimated. Up to 50 ids.
      tags:
        - request
      parameters:
        - in: query
          name: ids
          required: true
          description: Request ids, comma-separated
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              type: integer
              minimum: 1
      responses:
        '200':
          description: An estimate per request id
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    stage:
                      type: string
                      enum:
                        [
                          awaiting_approval,
                          unreleased,
                          searching,
                          downloading,
                          available,
                          unknown,
                        ]
                    date:
                      type: string
                    kind:
                      type: string
                    typicalDays:
                      type: number
                    minutesLeft:
                      type: number
  /request/missing:
    post:
      summary: Request several titles, each only if nothing has it yet
      description: |
        Requests each title that is not in the library, on its way, or already asked for; a series with every season. Each goes through the usual request rules (permissions, quotas, auto-approval). Up to 20 titles.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [tmdbId, mediaType]
                    properties:
                      tmdbId:
                        type: integer
                      mediaType:
                        type: string
                        enum: [movie, tv]
      responses:
        '200':
          description: What happened to each title
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        tmdbId:
                          type: integer
                        mediaType:
                          type: string
                        outcome:
                          type: string
                          enum: [requested, here, asked, failed]
                        message:
                          type: string
