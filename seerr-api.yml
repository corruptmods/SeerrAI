openapi: '3.0.2'
info:
  title: 'Seerr API'
  version: '1.0.0'
  description: |
    This is the documentation for the Seerr API backend.

    Two primary authentication methods are supported:

    - **Cookie Authentication**: A valid sign-in to the `/auth/plex` or `/auth/local` will generate a valid authentication cookie.
    - **API Key Authentication**: Sign-in is also possible by passing an `X-Api-Key` header along with a valid API Key generated by Seerr.
tags:
  - name: public
    description: Public API endpoints requiring no authentication.
  - name: ai
    description: Features that use the AI model an admin set up.
  - name: settings
    description: Endpoints related to Seerr's settings and configuration.
  - name: backfill
    description: Admin only. Finds packs Sonarr cannot, judges them file by file, and imports what an admin approves.
  - name: subtitles
    description: A title's subtitles, read from Bazarr, and the subtitle each person's Plex player starts with.
  - name: auth
    description: Endpoints related to logging in or out, and the currently authenticated user.
  - name: users
    description: Endpoints related to user management.
  - name: search
    description: Endpoints related to search and discovery.
  - name: request
    description: Endpoints related to request management.
  - name: movies
    description: Endpoints related to retrieving movies and their details.
  - name: tv
    description: Endpoints related to retrieving TV series and their details.
  - name: other
    description: Endpoints related to other TMDB data
  - name: person
    description: Endpoints related to retrieving person details.
  - name: media
    description: Endpoints related to media management.
  - name: collection
    description: Endpoints related to retrieving collection details.
  - name: service
    description: Endpoints related to getting service (Radarr/Sonarr) details.
  - name: watchlist
    description: Collection of media to watch later
  - name: blocklist
    description: Blocklisted media from discovery page.
servers:
  - url: '{server}/api/v1'
    variables:
      server:
        default: http://localhost:5055

components:
  schemas:
    HiddenSliders:
      type: object
      properties:
        hidden:
          type: array
          items:
            type: integer
        networks:
          type: string
          nullable: true
          maxLength: 20000
          description: |
            This user's own list for the Networks row: a JSON list of `{ id, name, logoPath }` (at most
            50), or `null` for the usual list. Left out, it is unchanged.
    PlexMatchProblem:
      type: object
      properties:
        kind:
          type: string
          enum: [movie, series]
        folder:
          type: string
        reason:
          type: string
          enum: [other, differentId, unmatched]
        expected:
          type: object
          properties:
            title:
              type: string
            year:
              type: number
            tmdbId:
              type: number
            tvdbId:
              type: number
            imdbId:
              type: string
            server:
              type: string
        mediaServer:
          type: string
          enum: [Plex, Jellyfin, Emby]
        matched:
          type: object
          description: What the media server matched the folder to, and its id for the item.
          properties:
            title:
              type: string
            year:
              type: number
            key:
              type: string
            tmdbId:
              type: number
            tvdbId:
              type: number
            imdbId:
              type: string
    PlexMatchReport:
      type: object
      properties:
        finishedAt:
          type: string
          nullable: true
        running:
          type: boolean
        checked:
          type: number
        notChecked:
          type: number
        error:
          type: string
        problems:
          type: array
          items:
            $ref: '#/components/schemas/PlexMatchProblem'
    BackfillSettings:
      type: object
      properties:
        enabled:
          type: boolean
        prowlarr:
          type: object
          properties:
            hostname:
              type: string
            port:
              type: number
            useSsl:
              type: boolean
            urlBase:
              type: string
            apiKey:
              type: string
              description: Never sent back; blank keeps the saved key.
            hasApiKey:
              type: boolean
        torrentClientId:
          type: number
          nullable: true
        usenetClientId:
          type: number
          nullable: true
        category:
          type: string
        includeMovies:
          type: boolean
        stuckAfterHours:
          type: number
        includeCutoffUnmet:
          type: boolean
        includeSpecials:
          type: boolean
        searchesPerScan:
          type: number
        researchAfterDays:
          type: number
        autoApprove:
          type: object
          properties:
            enabled:
              type: boolean
            minScore:
              type: number
            maxSizeGb:
              type: number
        maxActiveJobs:
          type: number
        minFreeSpaceGb:
          type: number
        stallHours:
          type: number
        replaceFailed:
          type: boolean
        historyDays:
          type: number
        blockedGroups:
          type: array
          readOnly: true
          description: Release groups never taken. Changed only through /settings/backfill/blocked-groups; ignored here.
          items:
            type: string
    BackfillAnswer:
      type: object
      additionalProperties: true
    FeatureSwitches:
      type: object
      description: Optional features that are turned off. Anything not listed is on.
      properties:
        disabled:
          type: array
          items:
            type: string
      required:
        - disabled
    Passkey:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
          example: Apple Passwords
        backedUp:
          type: boolean
        createdAt:
          type: string
        lastUsedAt:
          type: string
          nullable: true
    FutureSeasons:
      type: object
      properties:
        following:
          type: boolean
          example: true
        fromSeason:
          type: number
          example: 4
      required:
        - following
    AiSettingsInput:
      type: object
      required:
        - enabled
        - provider
        - baseUrl
        - model
        - featureModels
        - dailyLimit
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [anthropic, openai]
        apiKey:
          type: string
        removeApiKey:
          type: boolean
        baseUrl:
          type: string
        model:
          type: string
        featureModels:
          type: object
          additionalProperties:
            type: string
        dailyLimit:
          type: number
    AiSettings:
      type: object
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        apiKey:
          type: string
          description: Always empty.
        hasApiKey:
          type: boolean
        baseUrl:
          type: string
        model:
          type: string
        featureModels:
          type: object
          additionalProperties:
            type: string
        dailyLimit:
          type: number
    AiCreditReport:
      type: object
      properties:
        billedBy:
          type: string
          nullable: true
          enum: [anthropic, openai, null]
        outOfCreditAt:
          type: string
          nullable: true
        hasAdminKey:
          type: boolean
        balance:
          type: number
          nullable: true
        balanceAt:
          type: string
          nullable: true
        source:
          type: string
          enum: [provider, estimate]
        providerProblem:
          type: string
        monthStart:
          type: string
        spentThisMonth:
          type: number
        spentSinceBalance:
          type: number
          nullable: true
        remaining:
          type: number
          nullable: true
        unpriced:
          type: array
          items:
            type: string
        models:
          type: array
          items:
            type: object
            properties:
              model:
                type: string
              requests:
                type: number
              inputTokens:
                type: number
              outputTokens:
                type: number
              cost:
                type: number
                nullable: true
        prices:
          type: object
          additionalProperties:
            type: object
            properties:
              input:
                type: number
              output:
                type: number
    Blocklist:
      type: object
      properties:
        tmdbId:
          type: number
          example: 1
        title:
          type: string
        media:
          $ref: '#/components/schemas/MediaInfo'
        userId:
          type: number
          example: 1
        reason:
          type: string
          maxLength: 500
          description: Why it was blocklisted. Optional.
        removeFiles:
          type: boolean
          description: >-
            Admin only. Also remove the title from Radarr/Sonarr and delete its
            files, adding an import exclusion so the *arr's lists cannot re-add
            it.
    Watchlist:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        tmdbId:
          type: number
          example: 1
        ratingKey:
          type: string
        type:
          type: string
        title:
          type: string
        media:
          $ref: '#/components/schemas/MediaInfo'
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        requestedBy:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        email:
          type: string
          example: 'hey@itsme.com'
          readOnly: true
        username:
          type: string
        plexUsername:
          type: string
          readOnly: true
        plexToken:
          type: string
          readOnly: true
        jellyfinAuthToken:
          type: string
          readOnly: true
        userType:
          type: integer
          example: 1
          readOnly: true
        permissions:
          type: number
          example: 0
        avatar:
          type: string
          readOnly: true
        createdAt:
          type: string
          example: '2020-09-02T05:02:23.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-02T05:02:23.000Z'
          readOnly: true
        requestCount:
          type: number
          example: 5
          readOnly: true
      required:
        - id
        - email
        - createdAt
        - updatedAt
    UserSettings:
      type: object
      properties:
        username:
          type: string
          nullable: true
          example: 'Mr User'
        email:
          type: string
          example: 'user@example.com'
        locale:
          type: string
          nullable: true
          example: 'en'
        discoverRegion:
          type: string
          nullable: true
          example: 'US'
        streamingRegion:
          type: string
          nullable: true
          example: 'US'
        originalLanguage:
          type: string
          nullable: true
          example: 'en'
        movieQuotaLimit:
          type: number
          nullable: true
          description: 'Maximum number of movie requests allowed'
          example: 10
        movieQuotaDays:
          type: number
          nullable: true
          description: 'Time period in days for movie quota'
          example: 30
        tvQuotaLimit:
          type: number
          nullable: true
          description: 'Maximum number of TV requests allowed'
          example: 5
        tvQuotaDays:
          type: number
          nullable: true
          description: 'Time period in days for TV quota'
          example: 14
        globalMovieQuotaDays:
          type: number
          nullable: true
          description: 'Global movie quota days setting'
          example: 30
        globalMovieQuotaLimit:
          type: number
          nullable: true
          description: 'Global movie quota limit setting'
          example: 10
        globalTvQuotaLimit:
          type: number
          nullable: true
          description: 'Global TV quota limit setting'
          example: 5
        globalTvQuotaDays:
          type: number
          nullable: true
          description: 'Global TV quota days setting'
          example: 14
        watchlistSyncMovies:
          type: boolean
          nullable: true
          description: 'Enable watchlist sync for movies'
          example: true
        watchlistSyncTv:
          type: boolean
          nullable: true
          description: 'Enable watchlist sync for TV'
          example: false
        traktUsername:
          type: string
          nullable: true
          description: 'Trakt username whose public watchlist is synced, as the Plex watchlist is'
          example: 'someone'
    MainSettings:
      type: object
      properties:
        autoImportPlexUsers:
          type: boolean
          description: Give everyone the server owner shares Plex with an account, hourly.
        disabledFeatures:
          type: array
          description: Optional features turned off for everyone. Set through /settings/features.
          items:
            type: string
        apiKey:
          type: string
          readOnly: true
        appLanguage:
          type: string
          example: en
        applicationTitle:
          type: string
          example: Seerr
        applicationUrl:
          type: string
          example: https://os.example.com
        hideAvailable:
          type: boolean
          example: false
        hideRequested:
          type: boolean
          example: false
        cacheImages:
          type: boolean
          example: true
        imageCacheMaxMb:
          type: integer
          minimum: 256
          example: 2048
          description: How big the image cache may grow, in MB, before the least recently used images are removed.
        partialRequestsEnabled:
          type: boolean
          example: false
        localLogin:
          type: boolean
          example: true
        mediaServerType:
          type: number
          example: 1
        newPlexLogin:
          type: boolean
          example: true
        defaultPermissions:
          type: number
          example: 32
        defaultWatchlistSyncMovies:
          type: boolean
          example: false
          description: Whether new accounts start with watchlist sync on for movies. Existing accounts keep their own choice.
        defaultWatchlistSyncTv:
          type: boolean
          example: false
          description: Whether new accounts start with watchlist sync on for series. Existing accounts keep their own choice.
        enableSpecialEpisodes:
          type: boolean
          example: false
        versionCheck:
          type: boolean
          example: false
    NetworkSettings:
      type: object
      properties:
        csrfProtection:
          type: boolean
          example: false
        forceIpv4First:
          type: boolean
          example: false
        trustProxy:
          type: boolean
          example: false
        proxy:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            hostname:
              type: string
              example: ''
            port:
              type: number
              example: 8080
            useSsl:
              type: boolean
              example: false
            user:
              type: string
              example: ''
            password:
              type: string
              example: ''
            bypassFilter:
              type: string
              example: ''
            bypassLocalAddresses:
              type: boolean
              example: true
        dnsCache:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            forceMinTtl:
              type: number
              example: 0
            forceMaxTtl:
              type: number
              example: -1
    PlexLibrary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Movies
        enabled:
          type: boolean
          example: false
      required:
        - id
        - name
        - enabled
    PlexSettings:
      type: object
      properties:
        name:
          type: string
          example: 'Main Server'
          readOnly: true
        machineId:
          type: string
          example: '1234123412341234'
          readOnly: true
        ip:
          type: string
          example: '127.0.0.1'
        port:
          type: number
          example: 32400
        useSsl:
          type: boolean
          nullable: true
        libraries:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/PlexLibrary'
        webAppUrl:
          type: string
          nullable: true
          example: 'https://app.plex.tv/desktop'
      required:
        - name
        - machineId
        - ip
        - port
    PlexConnection:
      type: object
      properties:
        protocol:
          type: string
          example: 'https'
        address:
          type: string
          example: '127.0.0.1'
        port:
          type: number
          example: 32400
        uri:
          type: string
          example: 'https://127-0-0-1.2ab6ce1a093d465e910def96cf4e4799.plex.direct:32400'
        local:
          type: boolean
          example: true
        status:
          type: number
          example: 200
        message:
          type: string
          example: 'OK'
      required:
        - protocol
        - address
        - port
        - uri
        - local
    PlexDevice:
      type: object
      properties:
        name:
          type: string
          example: 'My Plex Server'
        product:
          type: string
          example: 'Plex Media Server'
        productVersion:
          type: string
          example: '1.21'
        platform:
          type: string
          example: 'Linux'
        platformVersion:
          type: string
          example: 'default/linux/amd64/17.1/systemd'
        device:
          type: string
          example: 'PC'
        clientIdentifier:
          type: string
          example: '85a943ce-a0cc-4d2a-a4ec-f74f06e40feb'
        createdAt:
          type: string
          example: '2021-01-01T00:00:00.000Z'
        lastSeenAt:
          type: string
          example: '2021-01-01T00:00:00.000Z'
        provides:
          type: array
          items:
            type: string
            example: 'server'
        owned:
          type: boolean
          example: true
        ownerID:
          type: string
          example: '12345'
        home:
          type: boolean
          example: true
        sourceTitle:
          type: string
          example: 'xyzabc'
        accessToken:
          type: string
          example: 'supersecretaccesstoken'
        publicAddress:
          type: string
          example: '127.0.0.1'
        httpsRequired:
          type: boolean
          example: true
        synced:
          type: boolean
          example: true
        relay:
          type: boolean
          example: true
        dnsRebindingProtection:
          type: boolean
          example: false
        natLoopbackSupported:
          type: boolean
          example: false
        publicAddressMatches:
          type: boolean
          example: false
        presence:
          type: boolean
          example: true
        connection:
          type: array
          items:
            $ref: '#/components/schemas/PlexConnection'
      required:
        - name
        - product
        - productVersion
        - platform
        - device
        - clientIdentifier
        - createdAt
        - lastSeenAt
        - provides
        - owned
        - connection
    JellyfinLibrary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Movies
        enabled:
          type: boolean
          example: false
      required:
        - id
        - name
        - enabled
    JellyfinSettings:
      type: object
      properties:
        name:
          type: string
          example: 'Main Server'
          readOnly: true
        hostname:
          type: string
          example: 'http://my.jellyfin.host'
        externalHostname:
          type: string
          example: 'http://my.jellyfin.host'
        jellyfinForgotPasswordUrl:
          type: string
          example: 'http://my.jellyfin.host/web/index.html#!/forgotpassword.html'
        adminUser:
          type: string
          example: 'admin'
        adminPass:
          type: string
          example: 'mypassword'
        libraries:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/JellyfinLibrary'
        serverID:
          type: string
          readOnly: true
    MetadataSettings:
      type: object
      properties:
        settings:
          type: object
          properties:
            tv:
              type: string
              enum: [tvdb, tmdb]
              example: 'tvdb'
            anime:
              type: string
              enum: [tvdb, tmdb]
              example: 'tvdb'
    MaintainerrSettings:
      type: object
      required:
        - name
        - hostname
        - port
      properties:
        id:
          type: number
        name:
          type: string
        hostname:
          type: string
        port:
          type: number
        useSsl:
          type: boolean
        urlBase:
          type: string
        apiKey:
          type: string
        showBadges:
          type: boolean
        showDeletingSoon:
          type: boolean
        allowKeep:
          type: boolean
        keepDays:
          type: number
          minimum: 0
          maximum: 365
        soonDays:
          type: number
          minimum: 1
          maximum: 365
    DownloadClientSettings:
      type: object
      required:
        - name
        - type
        - hostname
        - port
      properties:
        id:
          type: number
        name:
          type: string
        type:
          type: string
          enum: [sabnzbd, nzbget, qbittorrent, transmission, deluge, rtorrent]
        hostname:
          type: string
        port:
          type: number
        useSsl:
          type: boolean
        urlBase:
          type: string
        apiKey:
          type: string
          description: SABnzbd's API key. Never returned; blank on saving keeps the saved one.
        username:
          type: string
          description: The client's sign-in username (not SABnzbd or Deluge); blank when it lets Seerr AI in without one.
        password:
          type: string
          description: The client's password (Deluge's Web UI password). Never returned; blank on saving keeps the saved one.
        hasApiKey:
          type: boolean
          readOnly: true
        hasPassword:
          type: boolean
          readOnly: true
    BazarrSettings:
      type: object
      required:
        - hostname
        - port
      properties:
        hostname:
          type: string
        port:
          type: number
        useSsl:
          type: boolean
        urlBase:
          type: string
        apiKey:
          type: string
          description: Bazarr's API key. Never returned; blank on saving keeps the saved one.
        hasApiKey:
          type: boolean
          readOnly: true
    SubtitleTrack:
      type: object
      properties:
        id:
          type: number
        language:
          type: string
          example: en
        language3:
          type: string
          example: eng
        name:
          type: string
          example: English
        kind:
          type: string
          enum: [file, embedded]
        hi:
          type: boolean
        forced:
          type: boolean
        fileName:
          type: string
        size:
          type: number
        ai:
          type: boolean
          description: Made by transcribing the audio with Whisper.
        origin:
          type: string
          enum: [transcribed, downloaded, uploaded, translated]
          description: Where the file came from, when Bazarr recorded it.
        provider:
          type: string
          description: The provider it was downloaded from.
    MissingSubtitle:
      type: object
      properties:
        language:
          type: string
        name:
          type: string
        hi:
          type: boolean
        forced:
          type: boolean
    MovieSubtitles:
      type: object
      properties:
        profile:
          type: string
          nullable: true
        wanted:
          type: array
          items:
            type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/MissingSubtitle'
    SeriesSubtitles:
      type: object
      properties:
        profile:
          type: string
          nullable: true
        wanted:
          type: array
          items:
            type: string
        episodes:
          type: array
          items:
            type: object
            properties:
              seasonNumber:
                type: number
              episodeNumber:
                type: number
              title:
                type: string
              tracks:
                type: array
                items:
                  $ref: '#/components/schemas/SubtitleTrack'
              missing:
                type: array
                items:
                  $ref: '#/components/schemas/MissingSubtitle'
    SubtitleSearchResult:
      type: object
      properties:
        provider:
          type: string
        subtitle:
          type: string
        language:
          type: string
        score:
          type: number
        hi:
          type: boolean
        forced:
          type: boolean
        originalFormat:
          type: boolean
        releases:
          type: array
          items:
            type: string
        matched:
          type: array
          items:
            type: string
        missed:
          type: array
          items:
            type: string
        ai:
          type: boolean
    SubtitleSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleSearchResult'
        noneFound:
          type: string
          enum: [started, alreadyQueued, notMissing, unavailable]
          description: Set only when no provider but Whisper had anything the title is missing.
    SubtitleChoice:
      type: object
      required:
        - provider
        - subtitle
      properties:
        provider:
          type: string
        subtitle:
          type: string
        hi:
          type: boolean
        forced:
          type: boolean
        originalFormat:
          type: boolean
    TranscriptionStatus:
      type: object
      properties:
        queued:
          type: number
        running:
          type: boolean
        done:
          type: number
        failed:
          type: number
        searching:
          type: boolean
          description: Bazarr is searching for what the title is missing.
        auto:
          type: number
          description: Of those queued or under way, how many are there because a search found nothing.
        current:
          type: object
          properties:
            seasonNumber:
              type: number
            episodeNumber:
              type: number
