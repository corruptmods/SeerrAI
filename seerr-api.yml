        - in: query
          name: tmdbId
          required: true
          schema:
            type: number
        - in: query
          name: mediaType
          required: true
          schema:
            type: string
            enum: [movie, tv]
      responses:
        '200':
          description: Matching list ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /list/suggestions:
    get:
      summary: Pending removal suggestions for the caller's lists
      description: Runs a throttled Tautulli check, then returns titles everyone on a watch-sync list has finished.
      tags:
        - list
      responses:
        '200':
          description: Pending suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /list/suggestions/{suggestionId}:
    post:
      summary: Remove the suggested title or keep it on the list
      tags:
        - list
      parameters:
        - in: path
          name: suggestionId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [remove, keep]
      responses:
        '200':
          description: Suggestion resolved
          content:
            application/json:
              schema:
                type: object
  /list/import/search:
    post:
      summary: Turn pasted text into candidate matches for review
      description: Parses a block of text into title lines and searches TMDB for each. Adds nothing; the caller confirms first.
      tags:
        - list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Candidates per line
          content:
            application/json:
              schema:
                type: object
  /list/import/trakt:
    post:
      summary: Read the titles on a public Trakt list or watchlist
      description: Needs a Trakt Client ID in Settings. Adds nothing; the titles go through /list/import/resolve for review.
      tags:
        - list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: https://trakt.tv/users/someone/lists/favourites
      responses:
        '200':
          description: The titles, in list order, up to 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  titles:
                    type: array
                    items:
                      type: object
                      properties:
                        mediaType:
                          type: string
                          enum: [movie, tv]
                        tmdbId:
                          type: number
                        title:
                          type: string
                        year:
                          type: number
                  truncated:
                    type: boolean
        '400':
          description: Not a Trakt link, Trakt not set up, or Trakt refused; `problem` says which
  /list/import/resolve:
    post:
      summary: Turn titles known by TMDB id into matches for review
      description: Up to 25 at a time. A title without an id, or with one TMDB no longer has, is searched for by name.
      tags:
        - list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      tmdbId:
                        type: number
                      mediaType:
                        type: string
                      title:
                        type: string
                      year:
                        type: number
      responses:
        '200':
          description: Candidates per title, as /list/import/search gives them
          content:
            application/json:
              schema:
                type: object
  /list/{listId}/import:
    post:
      summary: Add confirmed titles to a list in bulk
      tags:
        - list
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                request:
                  type: boolean
                  description: Also request titles not already in the library, up to 20
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      tmdbId:
                        type: number
                      mediaType:
                        type: string
                        enum: [movie, tv, collection]
                      posterPath:
                        type: string
                        nullable: true
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: number
                  skipped:
                    type: number
                  requested:
                    type: number
                  requestFailed:
                    type: number
                  notRequested:
                    type: number
                    description: Titles added but not requested, past the 20 one import may request
  /list/{listId}/membership:
    post:
      summary: Accept a list that was shared with you
      description: >-
        A list can be seen as soon as it is shared, but the member's watch
        history is only used for it (watch sync, picks for a room) once they
        accept. Turning a list down is leaving it.
      tags:
        - list
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: number
      responses:
        '204':
          description: Accepted (accepting again keeps the first time)
        '400':
          description: The owner does not accept their own list
        '404':
          description: List not found
    delete:
      summary: Leave a list that was shared with you
      tags:
        - list
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: number
      responses:
        '204':
          description: Left the list
        '400':
          description: The owner cannot leave their own list
        '404':
          description: List not found
  /list/{listId}:
    get:
      summary: Returns a single list with its items
      tags:
        - list
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: List returned
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Rename a list or change who it is shared with
      tags:
        - list
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                watchedSync:
                  type: boolean
                memberIds:
                  type: array
                  items:
                    type: number
                previousMemberIds:
                  type: array
                  description: >-
                    Who the list was shared with when the sharing dialog
                    opened. If that has changed since, the save is refused
                    with 409 rather than undo the change.
                  items:
                    type: number
      responses:
        '200':
          description: List updated
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Who the list is shared with changed since previousMemberIds
    delete:
      summary: Delete a list
      tags:
        - list
      parameters:
        - in: path
          name: listId
          required: true
          schema:
            type: number
      responses:
        '204':
          description: List deleted
