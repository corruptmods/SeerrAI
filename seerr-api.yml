  /subtitles/tv/{tmdbId}/plex-default:
    parameters:
      - in: path
        name: tmdbId
        required: true
        schema:
          type: number
    get:
      summary: The subtitle language your Plex player starts this series with
      tags:
        - subtitles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexSubtitleDefault'
    put:
      summary: Choose the subtitle language for every episode in your Plex player
      description: Set on each episode in the background.
      tags:
        - subtitles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
              properties:
                language:
                  type: string
                  description: Plex's three-letter code; blank for none.
      responses:
        '202':
          description: Started
  /settings/download-clients:
