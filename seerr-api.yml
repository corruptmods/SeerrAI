                    type: number
                  tv:
                    type: number
                  pending:
                    type: number
                  approved:
                    type: number
                  declined:
                    type: number
                  processing:
                    type: number
                  available:
                    type: number
                  completed:
                    type: number
  /request/{requestId}/watch:
    get:
      summary: Whether the current user is watching a request
      description: Also reports whether the user has any notification channel that could deliver the result.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Watch state
          content:
            application/json:
              schema:
                type: object
