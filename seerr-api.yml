                    type: array
                    items:
                      type: object
                      properties:
                        tmdbId:
                          type: number
                        mediaType:
                          type: string
                  notify:
                    type: array
                    items:
                      type: object
                      properties:
                        tmdbId:
                          type: number
                        mediaType:
                          type: string
  /list/contains:
    get:
      summary: Which of the user's lists contain a title
      tags:
