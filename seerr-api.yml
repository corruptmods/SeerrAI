  /media/{mediaId}/anime:
    get:
      summary: A title's anime setting and where it sits in Sonarr or Radarr
      description: Whether Seerr treats the title as anime and why (its own setting, a rule on its request, or detection), and for each Sonarr or Radarr server it is on, where it is and what would put it where anime, or the rest, belongs. Admins only.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: The setting and placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimePlacement'
        '404':
          description: No such media
    put:
      summary: Set a title as anime, not anime, or automatic
      description: Saves the title's own anime setting, which stands over override rules and anime detection when it is requested (a requester's own choice still stands for their request), clears anime-or-not choices on its requests that disagree, and puts it where that says it belongs on every Sonarr or Radarr server it is on (root folder, with its files moved; quality profile; and for a series, series type). Saving the same setting again puts it right if it has moved. Admins only.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [animeSetting]
              properties:
                animeSetting:
                  type: boolean
                  nullable: true
                  description: true for anime, false for not anime, null for automatic.
      responses:
        '200':
          description: The setting and placement after saving, and what was changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AnimePlacement'
                  - type: object
                    properties:
                      applied:
                        type: array
                        items:
                          type: object
                          properties:
                            serverName:
                              type: string
                            is4k:
                              type: boolean
                            changes:
                              $ref: '#/components/schemas/AnimePlacementChanges'
                            error:
                              type: string
        '404':
          description: No such media
