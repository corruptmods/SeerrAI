  /maintainerr/deleting:
    get:
      summary: Titles Maintainerr will delete soon
      tags:
        - maintainerr
      responses:
        '200':
          description: What is due, and what each title allows
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        mediaId:
                          type: number
                          nullable: true
                          description: Seerr's media id, if Seerr has the title
                        tmdbId:
                          type: number
                        mediaType:
                          type: string
                        deleteAt:
                          type: string
                        showBadge:
                          type: boolean
                        showInRow:
                          type: boolean
                        canKeep:
                          type: boolean
  /maintainerr/keep:
    post:
      summary: Keep a title by postponing its deletion
      tags:
        - maintainerr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tmdbId
                - mediaType
              properties:
                tmdbId:
                  type: number
                mediaType:
                  type: string
                  enum: [movie, tv]
      responses:
        '200':
          description: Postponed. deleteAt is null once no longer scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleteAt:
                    type: string
                    nullable: true
  /settings/health:
    get:
      summary: Health of connected services, requests, titles and users
      description: Admin only. Service checks run in parallel, each with a timeout.
      tags:
        - settings
      responses:
        '200':
          description: The checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkedAt:
                    type: string
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        group:
                          type: string
                          enum: [services, requests, media, users]
                        name:
                          type: string
                        status:
                          type: string
                          enum: [ok, warning, error]
                        count:
                          type: number
                        detail:
                          type: string
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              title:
                                type: string
                              detail:
                                type: string
                              href:
                                type: string
  /settings/health/resources:
    get:
      summary: What Seerr's own container is using
      description: CPU, memory and processes for the container Seerr runs in, read from its cgroup, with the last hour of readings and the last day as five-minute averages.
      tags:
        - settings
      responses:
        '200':
          description: Current use and history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /settings/health/checks/{checkId}:
    get:
      summary: One page of one health check's list
      description: Ten items a page; count is the check's total.
      tags:
        - settings
      parameters:
        - in: path
          name: checkId
          required: true
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: The check
          content:
            application/json:
              schema:
                type: object
  /settings/health/search-all-missing:
    post:
      summary: Search Radarr and Sonarr for every stuck title
      description: Admin only. Everything the health page lists as stuck and searchable.
      tags:
        - settings
      responses:
        '200':
          description: What was searched
          content:
            application/json:
              schema:
                type: object
                properties:
                  titles:
                    type: number
                  episodes:
                    type: number
                  failed:
                    type: number
  /settings/health/unlinked-requests:
    delete:
      summary: Remove requests no longer linked to a title
      description: Admin only. Touches only requests with no title.
      tags:
        - settings
      responses:
        '200':
          description: How many were removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: number
  /settings/ai:
    get:
