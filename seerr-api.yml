                    nullable: true
                    example: Asia/Tokyo
                  appDataPath:
                    type: string
                    example: /app/config
  /auth/me:
    get:
      summary: Get logged-in user
      description: Returns the currently logged-in user.
      tags:
        - auth
        - users
      responses:
        '200':
          description: Object containing the logged-in user in JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/plex:
    post:
      summary: Sign in using a Plex token
      description: Takes an `authToken` (Plex token) to log the user in. Generates a session cookie for use in further requests. If the user does not exist, and there are no other users, then a user will be created with full admin privileges. If a user logs in with access to the main Plex server, they will also have an account created, but without any permissions.
      security: []
      tags:
        - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authToken:
                  type: string
              required:
                - authToken
  /auth/jellyfin:
    post:
      summary: Sign in using a Jellyfin username and password
      description: Takes the user's username and password to log the user in. Generates a session cookie for use in further requests. If the user does not exist, and there are no other users, then a user will be created with full admin privileges. If a user logs in with access to the Jellyfin server, they will also have an account created, but without any permissions.
      security: []
      tags:
        - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                hostname:
                  type: string
                email:
                  type: string
                serverType:
                  type: number
              required:
                - username
                - password
  /auth/jellyfin/quickconnect/initiate:
    post:
      summary: Initiate Jellyfin Quick Connect
      description: Initiates a Quick Connect session and returns a code for the user to authorize on their Jellyfin server.
      security: []
      tags:
        - auth
      responses:
        '200':
          description: Quick Connect session initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: '123456'
                  secret:
                    type: string
                    example: 'abc123def456'
        '500':
          description: Failed to initiate Quick Connect
  /auth/jellyfin/quickconnect/check:
    get:
      summary: Check Quick Connect authorization status
      description: Checks if the Quick Connect code has been authorized by the user.
      security: []
      tags:
        - auth
      parameters:
        - in: query
          name: secret
          required: true
          schema:
            type: string
          description: The secret returned from the initiate endpoint
      responses:
        '200':
          description: Authorization status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: false
        '404':
          description: Quick Connect session not found or expired
  /auth/jellyfin/quickconnect/authenticate:
    post:
      summary: Authenticate with Quick Connect
      description: Completes the Quick Connect authentication flow and creates a user session.
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
              required:
                - secret
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Quick Connect not authorized or access denied
        '500':
          description: Authentication failed
  /auth/local:
    post:
      summary: Sign in using a local account
      description: Takes an `email` and a `password` to log the user in. Generates a session cookie for use in further requests.
      security: []
      tags:
        - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
  /ai/status:
    get:
      summary: The AI features on for this user, and answers left today
      tags:
        - ai
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: object
                    additionalProperties:
                      type: boolean
                  remaining:
                    type: number
                    nullable: true
  /ai/chat:
    post:
      summary: Find titles from a description, request them, or fix a problem with one
      tags:
        - ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
                  description: What was asked. May be empty when a picture is sent.
                image:
                  type: object
                  description: A picture to find titles in, such as a poster or a screen
                  required:
                    - type
                    - data
                  properties:
                    type:
                      type: string
                      enum: [image/jpeg, image/png, image/webp, image/gif]
                    data:
                      type: string
                      description: The picture's bytes, base64, up to 5 MB
                turns:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      ask:
                        type: string
                      reply:
                        type: string
                      offered:
                        type: array
                        items:
                          type: string
      responses:
        '200':
          description: A short reply and the matching titles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/fix:
    post:
      summary: Carry out a fix offered in the AI chat that replaces files
      description: The chat only offers a fix that replaces a file (`confirm` in its answer); this files it as an issue and starts it, once the person has confirmed it. Requires permission to report issues.
      tags:
        - ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - mediaId
              properties:
                kind:
                  type: string
                  enum: [broken, wrongEpisode]
                mediaId:
                  type: number
                seasonNumber:
                  type: number
                episodeNumber:
                  type: number
                message:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: What was done, and the issue that follows it
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/reasons:
    get:
      summary: Why each title on a page of suggestions was suggested
      tags:
        - ai
      parameters:
        - in: query
          name: page
          schema:
            type: number
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [all, movie, tv]
      responses:
        '200':
          description: Reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /ai/pick/people:
    get:
      summary: People who can be included in a pick
      tags:
        - ai
      responses:
        '200':
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /ai/pick:
    post:
      summary: Three titles a group would enjoy together
      tags:
        - ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                people:
                  type: array
                  items:
                    type: number
                kind:
                  type: string
                  enum: [movie, tv, any]
                mood:
                  type: string
                  maxLength: 150
                availableOnly:
                  type: boolean
      responses:
        '200':
          description: Picks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /ai/recap/{tvId}/position:
    get:
      summary: Where a recap of this series should stop, for this user
      tags:
        - ai
      parameters:
        - in: path
          name: tvId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Position, or null when unknown
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/recap/{tvId}:
    get:
      summary: A spoiler-free recap up to an episode
      tags:
        - ai
      parameters:
        - in: path
          name: tvId
          required: true
          schema:
            type: number
        - in: query
          name: season
          required: true
          schema:
            type: number
        - in: query
          name: episode
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Recap
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/deletion-review:
    post:
      summary: Titles Maintainerr is about to delete that may be a mistake
      description: Requires `MANAGE_REQUESTS` or `ADMIN`.
      tags:
        - ai
      responses:
        '200':
          description: Flagged titles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /ai/issue/{issueId}:
    get:
      summary: A likely cause and fix for a reported issue
      description: Requires `MANAGE_ISSUES` or `ADMIN`.
      tags:
        - ai
      parameters:
        - in: path
          name: issueId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Suggestion
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ai/explain-log:
    post:
      summary: What a log entry means
      description: Requires `ADMIN`. Anything that looks like a secret is removed first.
      tags:
        - ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                label:
                  type: string
                level:
                  type: string
                message:
                  type: string
                data: {}
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/passkey:
    get:
      summary: The current user's passkeys
      description: Lists the passkeys the signed-in user can sign in with.
      tags:
        - auth
      responses:
        '200':
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Passkey'
  /auth/passkey/register/options:
    post:
      summary: Start adding a passkey
      description: Returns WebAuthn creation options for the signed-in user. The challenge is kept in the session for five minutes.
      tags:
        - auth
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/passkey/register:
    post:
      summary: Finish adding a passkey
      description: Verifies the browser's WebAuthn registration response and saves the passkey.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: object
                  additionalProperties: true
                name:
                  type: string
              required:
                - response
      responses:
        '201':
          description: Passkey added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          description: Expired or could not be verified
        '409':
          description: Already added
  /auth/passkey/{passkeyId}:
    parameters:
      - in: path
        name: passkeyId
        required: true
        schema:
          type: number
    put:
      summary: Rename one of your passkeys
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '404':
          description: Not one of yours
    delete:
      summary: Remove one of your passkeys
      tags:
        - auth
      responses:
        '204':
          description: Removed
        '404':
          description: Not one of yours
  /auth/passkey/login/options:
    post:
      summary: Start signing in with a passkey
      description: Returns WebAuthn request options. No account is named; the device offers its passkeys for this site.
      security: []
      tags:
        - auth
      responses:
        '200':
          description: WebAuthn PublicKeyCredentialRequestOptionsJSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/passkey/login:
    post:
      summary: Sign in with a passkey
      description: Verifies the browser's WebAuthn authentication response and signs its owner in. Plex accounts must still have access to the server.
      security: []
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: object
                  additionalProperties: true
              required:
                - response
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Expired
        '403':
          description: Refused
  /auth/logout:
    post:
      summary: Sign out and clear session cookie
      description: Completely clear the session cookie and associated values, effectively signing the user out.
      tags:
        - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'ok'
  /auth/reset-password:
    post:
      summary: Send a reset password email
      description: Sends a reset password email to the email if the user exists
      security: []
      tags:
        - users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'ok'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
  /auth/reset-password/{guid}:
    post:
      summary: Reset the password for a user
      description: Resets the password for a user if the given guid is connected to a user
      security: []
      tags:
        - users
      parameters:
        - in: path
          name: guid
          required: true
          schema:
            type: string
            example: '9afef5a7-ec89-4d5f-9397-261e96970b50'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'ok'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
  /user:
    get:
      summary: Get all users
      description: Returns all users in a JSON object.
      tags:
        - users
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: sort
          schema:
            type: string
            enum: [created, updated, requests, displayname, usertype, role]
            default: created
        - in: query
          name: sortDirection
          description: |
            Sort direction. When omitted, the server chooses the direction per sort
            field (e.g. displayname defaults to asc, requests/updated to desc).
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: includeIds
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A JSON array of all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      summary: Create new user
      description: |
        Creates a new user. Requires the `MANAGE_USERS` permission.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'hey@itsme.com'
                username:
                  type: string
                permissions:
                  type: number
      responses:
        '201':
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: Update batch of users
      description: |
        Update users with given IDs with provided values in request `body.settings`. You cannot update users' Plex tokens through this request.

        Requires the `MANAGE_USERS` permission.
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                permissions:
                  type: integer
      responses:
        '200':
          description: Successfully updated user details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /user/import-from-plex:
    post:
      summary: Import all users from Plex
      description: |
        Fetches and imports users from the Plex server. If a list of Plex IDs is provided in the request body, only the specified users will be imported. Otherwise, all users will be imported.

        Requires the `MANAGE_USERS` permission.
      tags:
        - users
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plexIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The newly created users, and how many people already imported were refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdUsers:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  refreshedUsers:
                    type: number
  /user/import-from-jellyfin:
    post:
      summary: Import all users from Jellyfin
      description: |
        Fetches and imports users from the Jellyfin or Emby server. People already imported are refreshed (their name and picture from the server). If a list of Jellyfin user IDs is provided in the request body, only those of them not yet imported are created; otherwise everyone not yet imported is.

        Requires the `MANAGE_USERS` permission.
      tags:
        - users
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                jellyfinUserIds:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The newly created users, and how many people already imported were refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdUsers:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  refreshedUsers:
                    type: number
  /user/registerPushSubscription:
    post:
      summary: Register a web push /user/registerPushSubscription
      description: Registers a web push subscription for the logged-in user
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                auth:
                  type: string
                p256dh:
                  type: string
                userAgent:
                  type: string
              required:
                - endpoint
                - auth
                - p256dh
      responses:
        '204':
          description: Successfully registered push subscription
  /user/{userId}/pushSubscriptions:
    get:
      summary: Get all web push notification settings for a user
      description: |
        Returns all web push notification settings for a user in a JSON object.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: User web push notification settings in JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                  p256dh:
                    type: string
                  auth:
                    type: string
                  userAgent:
                    type: string
  /user/{userId}/pushSubscription/{endpoint}:
    get:
      summary: Get web push notification settings for a user
      description: |
        Returns web push notification settings for a user in a JSON object.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: endpoint
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User web push notification settings in JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                  p256dh:
                    type: string
                  auth:
                    type: string
                  userAgent:
                    type: string
    delete:
      summary: Delete user push subscription by key
      description: Deletes the user push subscription with the provided key.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: endpoint
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successfully removed user push subscription
  /user/pushSubscriptionCounts:
    get:
      summary: Number of registered push devices per user
      description: Requires the MANAGE_USERS permission.
      tags:
        - users
      responses:
        '200':
          description: Per-user device counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: number
                    deviceCount:
                      type: number
  /user/{userId}:
    get:
      summary: Get user by ID
      description: |
        Retrieves user details in a JSON object. Requires the `MANAGE_USERS` permission.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Users details in JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: Update a user by user ID
      description: |
        Update a user with the provided values. You cannot update a user's Plex token through this request.

        Requires the `MANAGE_USERS` permission.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Successfully updated user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      summary: Delete user by ID
      description: Deletes the user with the provided userId. Requires the `MANAGE_USERS` permission.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: User successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /user/jellyfin/{jellyfinUserId}:
    get:
      summary: Get user by Jellyfin user ID
      description: |
        Retrieves user details by Jellyfin user ID in a JSON object. Returns filtered data based on the caller's permissions.
      tags:
        - users
      parameters:
        - in: path
          name: jellyfinUserId
          required: true
          schema:
            type: string
          description: The Jellyfin user ID (32-character hexadecimal string)
      responses:
        '200':
          description: User details in JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
  /user/{userId}/requests:
    get:
      summary: Get requests for a specific user
      description: |
        Retrieves a user's requests in a JSON object.
      tags:
        - users
      parameters:
        - in: path
