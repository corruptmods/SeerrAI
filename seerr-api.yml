      responses:
        '202':
          description: Started; the title's transcription status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TranscriptionStatus'
                  - type: object
                    properties:
                      transcribeAfter:
                        type: boolean
                        description: Bazarr has Whisper, so what the search cannot find is transcribed.
  /subtitles/movie/{tmdbId}/subtitle/{subtitleId}:
