          type: string
        seriesType:
          type: string
          nullable: true
          enum: [standard, daily, anime, null]
          description: Anime or not for this request, as its requester ticked it or as an override rule set it (a rule's may be any Sonarr series type); for a movie only anime or standard. Null leaves it to the title's own anime setting and then anime detection.
        ignoreQuota:
          type: boolean
          example: false
          description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
        declineReason:
          type: string
          nullable: true
          readOnly: true
          example: Already on Netflix
          description: Why the request was declined, if whoever declined it gave a reason. Plain text. On a title's page, only the requester and those who can see all requests are sent it.
