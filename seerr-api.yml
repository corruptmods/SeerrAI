        - in: query
          name: filter
          required: false
          schema:
            type: string
            enum: [active, found, ignored, done]
        - in: query
          name: q
          required: false
          description: Only titles whose name contains this, in any case; the tab counts then count matches
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
  /backfill/search-all:
