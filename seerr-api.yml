        - backfill
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
  /backfill/library:
    get:
      summary: 'Every series in Sonarr and movie in Radarr, to start a search by hand'
      tags:
        - backfill
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
  /backfill/series:
    post:
      summary: 'Follow a Sonarr series or a Radarr movie'
      tags:
        - backfill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [series, movie]
                serverId:
                  type: number
                arrId:
                  type: number
              required:
                - kind
                - serverId
                - arrId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
  /backfill/lookup:
    get:
      summary: "Backfill's state for titles, by comma-separated TMDB ids"
      tags:
        - backfill
      parameters:
        - in: query
          name: tmdbIds
          required: true
          description: TMDB ids, comma-separated
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: integer
              minimum: 1
        - in: query
          name: all
          required: false
          description: Complete titles too, for a title's page to link to
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillAnswer'
  /agent:
    get:
      summary: 'The admin agent: whether it can run, and its latest runs'
      tags:
        - backfill
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: number
        - in: query
          name: kind
          required: false
          description: With serverId and arrId, only that title's runs
          schema:
            type: string
            enum: [series, movie]
        - in: query
          name: serverId
          required: false
          schema:
            type: number
        - in: query
          name: arrId
          required: false
          schema:
            type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /agent/ask:
    post:
      summary: 'Ask the admin agent to find or fix something'
      tags:
        - backfill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                title:
                  type: object
                  description: The title in Sonarr or Radarr it is about; text may then be left out
                  required:
                    - kind
                    - serverId
                    - arrId
                  properties:
                    kind:
                      type: string
                      enum: [series, movie]
                    serverId:
                      type: number
                    arrId:
                      type: number
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
  /agent/clear:
    post:
      summary: Delete every finished admin agent conversation
      description: Conversations waiting on an answer stay. Downloads they started are not touched.
      tags:
        - backfill
      responses:
        '200':
          description: How many were deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: number
  /agent/{id}/reply:
    post:
      summary: 'Answer, correct or follow up a conversation with the admin agent'
      tags:
        - backfill
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
      responses:
        '202':
          description: It goes on
          content:
            application/json:
              schema:
                type: object
  /agent/{id}/approve:
    post:
      summary: 'Approve the changes the admin agent proposed'
      description: 'Only the proposal shown (by its id), and only once. The run goes on and makes each change, checked again first.'
      tags:
        - backfill
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposal
              properties:
                proposal:
                  type: string
                  format: uuid
      responses:
        '202':
          description: It goes on
          content:
            application/json:
              schema:
                type: object
        '409':
          description: The changes are no longer waiting
  /agent/{id}/decline:
    post:
      summary: 'Decline the changes the admin agent proposed'
      description: 'Nothing is changed, and the conversation is over until someone replies.'
      tags:
        - backfill
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposal
              properties:
                proposal:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Declined
          content:
            application/json:
              schema:
                type: object
        '409':
          description: The changes are no longer waiting
  /agent/{id}:
    get:
      summary: 'One run of the admin agent, step by step'
      tags:
        - backfill
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Delete one admin agent conversation
      description: Not while it is working. Downloads it started are not touched.
      tags:
        - backfill
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        '204':
          description: Deleted
        '409':
          description: It is working on it
  /backfill-status:
    get:
