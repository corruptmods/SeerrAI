      tags:
        - subtitles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexSubtitleDefault'
    put:
      summary: Choose the subtitle your Plex player starts this movie with
      tags:
        - subtitles
      requestBody:
        required: true
        content:
          application/json:
